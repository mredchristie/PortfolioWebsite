<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0e27;
        /* Same green-to-nothing wash the site uses behind its sections. */
        background-image:
          radial-gradient(circle at 12% 0%, rgba(0, 255, 136, 0.16), transparent 45%),
          radial-gradient(circle at 100% 100%, rgba(0, 153, 255, 0.12), transparent 42%);
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #e6edf3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        position: relative;
      }
      .prompt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 26px;
        color: #00ff88;
        letter-spacing: 0.02em;
      }
      h1 {
        font-size: 82px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.02em;
        max-width: 15ch;
      }
      .sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 30px;
        color: #8b98a5;
        margin-top: 26px;
        /* The copy carries its own line breaks; a max-width here would wrap
           them a second time and orphan trailing words. The 80px page padding
           is the only constraint that should apply. */
        line-height: 1.45;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .domain {
        font-family: 'JetBrains Mono', monospace;
        font-size: 26px;
        color: #8b98a5;
      }
      .tags {
        display: flex;
        gap: 12px;
      }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: #00ff88;
        border: 1px solid rgba(0, 255, 136, 0.35);
        border-radius: 999px;
        padding: 7px 18px;
      }
      /* Accent rule down the left edge, echoing the section numbering. */
      body::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 10px;
        background: linear-gradient(180deg, #00ff88, #0099ff);
      }
    </style>
  </head>
  <body>
    <div class="prompt">mredchristie@dev:~$ <span id="cmd"></span></div>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <footer>
      <span class="domain">mredchristie.dev</span>
      <span class="tags" id="tags"></span>
    </footer>
  </body>
</html>
